<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
    background: #f4f4f4;
  }

  .container {
    margin: 20px auto;
    max-width: 800px;
  }

  h1 {
    color: #333;
  }

  #videoPreview,
  #canvas {
    display: block;
    margin: 20px auto;
    max-width: 100%;
  }

  button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    background-color: #007bff;
    color: white;
    cursor: pointer;
  }

  button:disabled {
    background-color: #ccc;
    cursor: not-allowed;
  }
</style>

<div class="container">
  <h1>Video Date Overlay and Stitcher</h1>
  <input type="file" id="fileInput" multiple accept="video/*" />
  <button id="processButton" disabled>Process Videos</button>
  <video id="videoPreview" controls></video>
  <canvas id="canvas"></canvas>
  <button id="downloadButton" disabled>Download Final Video</button>
</div>
<script>
  const fileInput = document.getElementById("fileInput");
  const processButton = document.getElementById("processButton");
  const downloadButton = document.getElementById("downloadButton");
  const videoPreview = document.getElementById("videoPreview");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  let videos = [];
  let recorder;
  let recordedChunks = [];

  // Enable process button when files are selected
  fileInput.addEventListener("change", async (event) => {
    const files = Array.from(event.target.files);
    videos = await Promise.all(
      files.map(async (file) => {
        const creationDate = await getVideoCreationDate(file);
        return { file, creationDate: new Date(creationDate) };
      })
    );

    // Sort videos by creation date
    videos.sort((a, b) => a.creationDate - b.creationDate);

    if (videos.length) {
      processButton.disabled = false;
    }
  });

  // Process videos: overlay date and stitch
  processButton.addEventListener("click", async () => {
    recordedChunks = [];
    recorder = null;

    const stream = canvas.captureStream(30); // Set frame rate
    recorder = new MediaRecorder(stream, {
      mimeType: "video/webm; codecs=vp9", // Use high-quality codec
      videoBitsPerSecond: 5000000, // Increase bitrate
    });

    recorder.ondataavailable = (e) => recordedChunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: "video/webm" });
      const url = URL.createObjectURL(blob);
      downloadButton.disabled = false;
      downloadButton.onclick = () => {
        const a = document.createElement("a");
        a.href = url;
        a.download = "final_video.webm";
        a.click();
      };
    };

    recorder.start();
    for (let i = 0; i < videos.length; i++) {
      await processVideo(videos[i].file, videos[i].creationDate);
    }
    recorder.stop();
  });

  // Extract creation date from video metadata
  async function getVideoCreationDate(file) {
    return new Promise((resolve) => {
      const fileReader = new FileReader();
      fileReader.onload = () => {
        const arrayBuffer = fileReader.result;
        const dataView = new DataView(arrayBuffer);
        let creationDate = new Date().toISOString(); // Fallback

        try {
          // Search for metadata in the video file
          const textDecoder = new TextDecoder("utf-8");
          const text = textDecoder.decode(dataView);
          const dateMatch = text.match(/\d{4}-\d{2}-\d{2}/);
          if (dateMatch) {
            creationDate = dateMatch[0];
          }
        } catch (e) {
          console.error("Failed to extract metadata:", e);
        }

        resolve(creationDate);
      };
      fileReader.readAsArrayBuffer(file);
    });
  }

  // Overlay date on video
  async function processVideo(file, creationDate) {
    const formattedDate = new Date(creationDate).toLocaleDateString();

    return new Promise((resolve) => {
      const video = document.createElement("video");
      video.src = URL.createObjectURL(file);

      video.addEventListener("loadedmetadata", () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        video.addEventListener("play", () => {
          const drawFrame = () => {
            if (!video.paused && !video.ended) {
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

              // Overlay date
              ctx.font = "36px monospace";
              ctx.fillStyle = "white";
              ctx.textBaseline = "bottom";
              ctx.fillText(formattedDate, 10, canvas.height - 10);

              requestAnimationFrame(drawFrame);
            } else {
              resolve();
            }
          };
          drawFrame();
        });

        video.play();
      });
    });
  }
</script>
